[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core/tests", "bots/coder/tests", "bots/hr/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Gradual adoption — see docs/sdlc/designs/platform/hardening.md (Trade-offs).
# The existing code is partially typed; strict mode is deferred to a future ADR.
check_untyped_defs = false
exclude = "(^|/)(\\.venv|tests|docs)/"

[tool.coverage.run]
source = ["core/src", "bots/coder/src", "bots/hr/src"]
branch = false
